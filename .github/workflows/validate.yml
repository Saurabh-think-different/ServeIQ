name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --frozen --project microservices/backend pytest microservices/backend/tests -q
      - run: uv build --package servewell-backend --wheel

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: microservices/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -f microservices/backend/Dockerfile -t serveiq-backend:validation .
      - run: docker build -t serveiq-frontend:validation microservices/frontend
