[project]
name = "phdata2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saurabh-think-different", email = "saurabh.bharadwaj2000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.1.3",
    "google-adk>=2.12.0",
    "numpy>=2.5.4",
    "openai>=3.36.1",
    "pwdlib>=0.3.1",
    "pytest>=9.1.1",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
phdata2 = "phdata2:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
