apiVersion: apps/v1
kind: Deployment
metadata:
  name: servewell-backend
  labels:
    app: servewell-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: servewell-backend
  template:
    metadata:
      labels:
        app: servewell-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: servewell-backend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: DATA_DIR
              value: /opt/dataset
            - name: DATABASE_PATH
              value: /var/lib/servewell/servewell.db
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: servewell-ingestion
                  key: INGESTION_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: servewell-ingestion
                  key: OPENAI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: backend-storage
              mountPath: /var/lib/servewell
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: servewell-backend-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servewell-backend-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: servewell-backend
  labels:
    app: servewell-backend
spec:
  type: ClusterIP
  selector:
    app: servewell-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
