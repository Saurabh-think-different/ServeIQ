apiVersion: apps/v1
kind: Deployment
metadata:
  name: servewell-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servewell-frontend
  template:
    metadata:
      labels:
        app: servewell-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: servewell-frontend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: servewell-frontend
spec:
  type: ClusterIP
  selector:
    app: servewell-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
