apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: phdata
build:
  local:
    push: false
  artifacts:
    - image: phdata-backend
      context: .
      docker:
        dockerfile: phdata/microservices/backend/Dockerfile
    - image: phdata-frontend
      context: phdata/microservices/frontend
      docker:
        dockerfile: Dockerfile
    - image: phdata-qdrant
      context: phdata/microservices/qdrant
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - phdata/deploy/backend.yaml
    - phdata/deploy/backend-service.yaml
    - phdata/deploy/frontend.yaml
    - phdata/deploy/qdrant.yaml
deploy:
  kubeContext: rancher-desktop
  kubectl:
    hooks:
      before:
        - host:
            # Keep data claims outside Skaffold's cleanup-managed manifests.
            command:
              - kubectl
              - --context
              - rancher-desktop
              - apply
              - -f
              - phdata/deploy/backend-pvc.yaml
              - -f
              - phdata/deploy/qdrant-pvc.yaml
portForward:
  - resourceType: service
    resourceName: phdata-frontend
    port: 80
    localPort: 5173
  - resourceType: service
    resourceName: phdata-qdrant
    port: 6333
    localPort: 6333
  - resourceType: service
    resourceName: phdata-backend
    port: 8000
    localPort: 8000
