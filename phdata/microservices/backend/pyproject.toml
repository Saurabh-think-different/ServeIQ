[project]
name = "phdata-backend"
version = "0.1.0"
description = "ServeWell incident agent API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.136.3,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "google-adk>=2.12,<3",
  "litellm[mcp]>=1.84,<2",
  "openai>=2.54,<3",
  "qdrant-client>=1.13,<1.14",
  "tiktoken>=0.14,<1",
  "python-multipart>=0.0.32,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
